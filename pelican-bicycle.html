<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f1e7">
  <title>鹈鹕骑自行车 · SVG 2D 动画</title>
  <style>
    :root { color-scheme: light; --paper:#f6f1e7; --ink:#244749; --muted:#667d78; --orange:#db684e; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; padding:32px 20px; color:var(--ink); background:var(--paper); font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; }
    main { width:min(1040px,100%); }
    header { display:flex; align-items:end; justify-content:space-between; gap:24px; padding:0 4px 23px; }
    .eyebrow { margin:0 0 10px; color:var(--orange); font-size:11px; font-weight:700; letter-spacing:.22em; }
    h1 { margin:0; font-size:clamp(26px,4.2vw,43px); font-weight:750; letter-spacing:-.055em; }
    .subtitle { margin:10px 0 0; color:var(--muted); font-size:14px; line-height:1.6; }
    .edition { display:flex; align-items:center; gap:9px; flex:none; color:var(--muted); font-size:11px; letter-spacing:.08em; }
    .edition::before { content:""; width:7px; height:7px; background:#628a77; border-radius:50%; }
    .canvas { position:relative; overflow:hidden; border:1px solid #d5dfd3; border-radius:20px; background:#dfece3; box-shadow:0 16px 45px #345a4310; }
    .scene { display:block; width:100%; height:auto; }
    .scene-label { position:absolute; left:27px; top:22px; margin:0; color:#48756d; font-size:10px; letter-spacing:.14em; pointer-events:none; }
    .scene-label span { display:block; margin-top:7px; font-size:13px; letter-spacing:.03em; color:#325e58; }
    .controls { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:20px; padding:20px 4px 0; }
    .buttons { display:flex; gap:9px; }
    button { display:inline-flex; align-items:center; justify-content:center; gap:9px; min-height:44px; padding:11px 17px; border:1px solid #c6d0c7; border-radius:10px; background:transparent; color:var(--ink); font:inherit; font-size:13px; font-weight:650; cursor:pointer; }
    button:hover { background:#e6eadd; border-color:#9eb39f; }
    #toggle { min-width:120px; background:var(--ink); border-color:var(--ink); color:#fffaf0; }
    #toggle:hover { background:#346365; }
    .control-icon { width:16px; height:16px; fill:currentColor; flex:none; }
    button:focus-visible,input:focus-visible { outline:3px solid #d8845d; outline-offset:4px; }
    .speed { display:flex; gap:13px; align-items:center; color:var(--muted); font-size:12px; }
    .speed label { white-space:nowrap; }
    input[type=range] { width:112px; height:30px; accent-color:#466f64; cursor:pointer; }
    output { min-width:29px; font-variant-numeric:tabular-nums; color:var(--ink); }
    footer { display:flex; justify-content:space-between; gap:20px; margin:24px 4px 0; padding-top:15px; border-top:1px solid #d9dfd0; font-size:11px; color:var(--muted); line-height:1.7; }
    #motion-note { margin:0; }
    @media(max-width:600px) {
      body { padding:24px 12px; }
      header { align-items:start; gap:12px; padding-bottom:19px; }
      h1 { font-size:29px; }
      .edition { display:none; }
      .subtitle { font-size:12px; }
      .canvas { border-radius:13px; }
      .scene-label { left:14px; top:12px; font-size:8px; }
      .scene-label span { font-size:10px; margin-top:3px; }
      .controls { gap:14px; padding-top:16px; }
      .speed { width:100%; justify-content:flex-start; }
      input[type=range] { flex:1; max-width:180px; }
      footer { flex-direction:column; gap:4px; margin-top:20px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">A LITTLE RIDE BY THE SEA</p>
        <h1>鹈鹕的海边骑行</h1>
        <p class="subtitle">不赶时间，骑着自行车去吹吹海风。</p>
      </div>
      <div class="edition">SVG ANIMATION / 01</div>
    </header>

    <div class="canvas">
      <p class="scene-label">COASTAL ROUTE<span>沿海小路 · 天气晴</span></p>
      <svg id="scene" class="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="scene-title scene-desc">
        <title id="scene-title">鹈鹕骑自行车的二维动画</title>
        <desc id="scene-desc">戴着小帽子和橙色围巾的白色鹈鹕，踩着绿色自行车驶过海边。轮子各自绕轴转动，双脚踩踏，云朵、海浪和路边草丛向后移动。</desc>
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#dcebe0"/><stop offset="1" stop-color="#f4edcf"/>
          </linearGradient>
          <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#f3b371"/><stop offset="1" stop-color="#e68b5a"/>
          </linearGradient>
          <pattern id="sand" width="90" height="55" patternUnits="userSpaceOnUse">
            <path d="M10 12h4M62 31h6M31 48h3" stroke="#b7b091" stroke-width="2" stroke-linecap="round" opacity=".35"/>
          </pattern>
          <g id="wheel-detail" stroke="#69837d" stroke-width="1.8">
            <path d="M0-74V74M-74 0H74M-64-37L64 37M-64 37L64-37M-37-64L37 64M-37 64L37-64" />
            <rect x="50" y="-23" width="12" height="5" rx="2" fill="#e1a561" stroke="none"/>
          </g>
          <g id="cloud-shape" fill="#fffcf1">
            <path d="M0 27C-1 13 12 5 26 10C32-11 63-16 75 6C93 0 111 9 112 26C126 24 135 30 135 38H3C-7 37-7 30 0 27Z"/>

          </g>
          <g id="road-pattern" fill="#f7eed1">
            <rect x="15" y="553" width="71" height="5" rx="2.5"/>
            <rect x="175" y="553" width="71" height="5" rx="2.5"/>
            <rect x="335" y="553" width="71" height="5" rx="2.5"/>
            <rect x="495" y="553" width="71" height="5" rx="2.5"/>
            <rect x="655" y="553" width="71" height="5" rx="2.5"/>
            <rect x="815" y="553" width="71" height="5" rx="2.5"/>
            <rect x="975" y="553" width="71" height="5" rx="2.5"/>
            <rect x="1135" y="553" width="71" height="5" rx="2.5"/>
          </g>
        </defs>

        <!-- All illustrations are vectors; no images or remote assets. -->
        <rect width="1000" height="600" fill="url(#sky)"/>
        <circle cx="811" cy="124" r="48" fill="#f3cd82"/>
        <circle cx="811" cy="124" r="61" fill="none" stroke="#f5dfab" stroke-width="1.5"/>
        <g id="cloud-a" opacity=".83" transform="translate(230 78)"><use href="#cloud-shape"/></g>
        <g id="cloud-b" opacity=".75" transform="translate(50 209) scale(.65)"><use href="#cloud-shape"/></g>
        <g id="cloud-c" opacity=".5" transform="translate(890 205) scale(.8)"><use href="#cloud-shape"/></g>
        <g id="seabirds" fill="none" stroke="#809c8b" stroke-width="2" stroke-linecap="round">
          <path d="M113 158q9-8 18 0q9-8 18 0"/><path d="M157 141q6-5 12 0q6-5 12 0"/>
        </g>
        <path d="M0 320Q91 289 191 303Q280 313 391 295Q567 266 687 298Q857 276 1000 303V402H0Z" fill="#a9c9b3"/>
        <path d="M0 336Q140 307 299 328Q490 310 690 333Q885 310 1000 331V407H0Z" fill="#79afa3"/>
        <rect x="0" y="358" width="1000" height="104" fill="#85bdb2"/>
        <g id="sea-ripples" stroke="#d4e7cf" stroke-width="3" stroke-linecap="round" opacity=".65">
          <path d="M-160 377h65M20 377h65M200 377h65M380 377h65M560 377h65M740 377h65M920 377h65M1100 377h65"/>
          <path d="M-80 410h105M160 410h105M400 410h105M640 410h105M880 410h105M1120 410h105"/>
        </g>
        <path d="M0 439Q230 412 452 443Q746 421 1000 445V600H0Z" fill="#ded4ac"/>
        <path d="M0 458Q253 439 457 461Q757 442 1000 464" fill="none" stroke="#eee7c9" stroke-width="10"/>
        <g id="roadside">
          <use href="#grass-shape" transform="translate(117 466)"/>
          <use href="#grass-shape" transform="translate(875 477) scale(.8)"/>
          <g transform="translate(934 381)" stroke="#58796d" stroke-width="3.5" stroke-linejoin="round">
            <path d="M0 81V7" fill="none"/>
            <path d="M-40 4H28L44 19L28 34H-40Z" fill="#f4ecd5"/>
            <path d="M-12 19H17m-7-6 7 6-7 6" fill="none"/>
          </g>
        </g>
        <rect y="492" width="1000" height="108" fill="#c3bea0"/>
        <rect y="492" width="1000" height="108" fill="url(#sand)"/>
        <path d="M0 493H1000" stroke="#aab29b" stroke-width="2"/>
        <g id="road-lines"><use href="#road-pattern"/></g>
        <ellipse id="bike-shadow" cx="504" cy="514" rx="239" ry="10" fill="#637f68" opacity=".17"/>

        <!-- The far leg is behind the frame; both feet follow their own pedal. -->
        <path id="leg-back" d="M465 322L510 360L459 430" fill="none" stroke="#cf9258" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <g id="foot-back" transform="translate(459 430)">
          <path d="M-13-7Q0-11 14-3L23 1Q9 8-14 3Z" fill="#dfaa63" stroke="#3a5b54" stroke-width="2"/>
          <rect x="-15" y="5" width="32" height="5" rx="2" fill="#375e57"/>
        </g>

        <!-- A separate local coordinate system fixes each wheel's rotation axis. -->
        <g transform="translate(358 428)">
          <circle r="84" fill="none" stroke="#294c48" stroke-width="10"/>
          <circle r="76" fill="none" stroke="#f8f0d7" stroke-width="4"/>
          <g id="spokes-back"><use href="#wheel-detail"/></g>
          <circle r="7" fill="#f8f0d7" stroke="#31564e" stroke-width="3"/>
        </g>
        <g transform="translate(653 428)">
          <circle r="84" fill="none" stroke="#294c48" stroke-width="10"/>
          <circle r="76" fill="none" stroke="#f8f0d7" stroke-width="4"/>
          <g id="spokes-front"><use href="#wheel-detail"/></g>
          <circle r="7" fill="#f8f0d7" stroke="#31564e" stroke-width="3"/>
        </g>

        <!-- A real bicycle: rear triangle, main triangle, fork, saddle and chain. -->
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M291 402A77 77 0 0 1 422 384M593 382A77 77 0 0 1 728 400" stroke="#598675" stroke-width="5"/>
          <path d="M358 428L446 345L492 430ZM446 345L604 345L492 430M604 345L653 428M446 345L441 324" stroke="#294c48" stroke-width="12"/>
          <path d="M358 428L446 345L492 430ZM446 345L604 345L492 430M604 345L653 428M446 345L441 324" stroke="#599783" stroke-width="7"/>
          <path d="M604 345L620 295Q629 286 642 289" stroke="#294c48" stroke-width="7"/>
          <path d="M626 288H646" stroke="#d6af7a" stroke-width="8"/>
          <path d="M480 419L358 415Q337 426 357 441L491 442" stroke="#56796b" stroke-width="2.5"/>
          <path d="M423 324H458" stroke="#294c48" stroke-width="12"/>
          <path d="M423 322H458" stroke="#c98c5d" stroke-width="7"/>
        </g>
        <g transform="translate(492 430)">
          <circle r="18" fill="#eee2bd" stroke="#375e56" stroke-width="3"/>
          <g id="crank-arms" stroke="#365e57" stroke-width="4" stroke-linecap="round">
            <path d="M-32 0H32"/>
          </g>
          <circle r="5" fill="#345e55"/>
        </g>

        <!-- The pelican: curved neck, long bill and the characteristic throat pouch. -->
        <g id="pelican-body" stroke="#34564c" stroke-width="3.5" stroke-linejoin="round">
          <path d="M421 252L389 260L395 282L427 292" fill="#e0e3d3"/>
          <path d="M423 272L394 289L421 299" fill="#fcf8e8"/>
          <path d="M538 214C513 204 461 200 432 220C402 238 404 278 427 302C450 327 493 341 528 318C554 301 568 267 554 237Z" fill="#faf7e9"/>
          <path d="M429 292Q472 324 522 308" fill="none" stroke="#d5dcc7" stroke-width="9" stroke-linecap="round"/>
          <g id="head-neck">
            <path d="M505 291C546 278 541 233 547 199C540 182 539 157 555 142C573 124 601 130 615 148C628 164 628 188 617 201C599 211 574 201 572 220C567 247 583 282 555 311Z" fill="#faf7e9"/>
            <path d="M566 220Q570 251 550 279" fill="none" stroke="#d8dfca" stroke-width="5" stroke-linecap="round"/>
            <path d="M616 173L792 180Q811 182 798 190L622 192Z" fill="#efa661"/>
            <path d="M620 191L798 190C751 217 742 248 692 247C648 246 623 224 620 191Z" fill="url(#pouch)"/>
            <path d="M633 201Q648 230 690 234" fill="none" stroke="#f8c58a" stroke-width="3" stroke-linecap="round"/>
            <path d="M624 183L790 184" fill="none" stroke="#c17d4e" stroke-width="1.8"/>
            <g id="eye" transform="translate(594 160)">
              <circle r="5.5" fill="#294c48" stroke="none"/>
              <circle cx="1.6" cy="-1.7" r="1.6" fill="#fff" stroke="none"/>
            </g>
            <path d="M584 147Q591 143 599 146" fill="none" stroke="#526b56" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="581" cy="180" r="5.5" fill="#eac4a0" opacity=".6" stroke="none"/>
            <path d="M553 142Q554 119 582 120Q604 121 607 141Z" fill="#4f8175"/>
            <path d="M547 141Q581 147 617 141" fill="none" stroke="#34564c" stroke-width="6" stroke-linecap="round"/>
            <path d="M557 137Q579 131 603 138" fill="none" stroke="#9ab39b" stroke-width="3"/>
          </g>
          <path d="M543 214Q557 224 576 222L574 230Q551 234 538 222Z" fill="#d87552"/>
          <path id="scarf-tail" d="M542 217C518 205 492 227 470 208L477 225C502 237 525 219 542 229Z" fill="#db7956" stroke="#b46a4b" stroke-width="2"/>
          <path d="M532 218Q538 212 544 219Q550 227 541 231Z" fill="#e89769" stroke="#b46a4b" stroke-width="2"/>
        </g>

        <path id="leg-front" d="M482 326L539 366L524 430" fill="none" stroke="#e0a564" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <g id="foot-front" transform="translate(524 430)">
          <path d="M-13-7Q0-11 14-3L23 1Q9 8-14 3Z" fill="#e8b573" stroke="#36564d" stroke-width="2.5"/>
          <path d="M7-4L13 1M-2-4L3 2" stroke="#c99259" stroke-width="1.5" stroke-linecap="round"/>
          <rect x="-15" y="5" width="32" height="5" rx="2" fill="#375e57"/>
        </g>

        <!-- One wing reaches the handlebar instead of floating away from it. -->
        <path id="wing" d="M458 245C483 224 517 241 545 262Q584 288 635 285Q652 286 641 296C592 313 548 289 516 280C492 285 469 273 458 245Z" fill="#e5e9d8" stroke="#34564c" stroke-width="3.5" stroke-linejoin="round"/>
        <path id="wing-detail" d="M479 252Q502 271 534 272M484 246Q510 264 536 264" fill="none" stroke="#b1c0a7" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M634 288L642 288M635 293L643 292" stroke="#f9f2de" stroke-width="2.3" stroke-linecap="round"/>

        <g id="foreground-grass" transform="translate(0 0)">
          <use href="#grass-shape" transform="translate(55 591) scale(1.3)"/>
          <use href="#grass-shape" transform="translate(835 597)"/>
          <use href="#grass-shape" transform="translate(1115 591) scale(1.3)"/>
        </g>
      </svg>
    </div>

    <div class="controls" aria-label="动画控制">
      <div class="buttons">
        <button id="toggle" type="button" aria-pressed="false">
          <svg class="control-icon" viewBox="0 0 16 16" aria-hidden="true"><path id="play-icon" d="M4 3h3v10H4zM9 3h3v10H9z"/></svg>
          <span id="toggle-text">暂停动画</span>
        </button>
        <button id="restart" type="button">
          <svg class="control-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 3.3A6 6 0 1 1 2 8h1.6a4.4 4.4 0 1 0 2-3.7L8 6H2V0z"/></svg>
          从头播放
        </button>
      </div>
      <div class="speed">
        <label for="speed">骑行节奏</label>
        <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1">
        <output id="speed-value" for="speed">1×</output>
      </div>
    </div>
    <footer>
      <span>纯 SVG 绘制 · 无外部依赖 · 可离线播放</span>
      <p id="motion-note">空格键暂停 / 继续，R 键从头播放。</p>
    </footer>
    <noscript><p>已显示静态插画。启用 JavaScript 后可播放骑行动画。</p></noscript>
  </main>

  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const nodes = Object.fromEntries([
        'scene', 'toggle', 'toggle-text', 'play-icon', 'restart', 'speed', 'speed-value',
        'spokes-back', 'spokes-front', 'crank-arms', 'leg-back', 'leg-front',
        'foot-back', 'foot-front', 'pelican-body', 'head-neck', 'wing', 'wing-detail',
        'eye', 'scarf-tail', 'cloud-a', 'cloud-b', 'cloud-c', 'sea-ripples',
        'road-lines', 'roadside', 'foreground-grass', 'bike-shadow', 'motion-note'
      ].map(id => [id, $(id)]));
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let running = !reduceMotion.matches;
      let time = 0;
      let speed = 1;
      let lastFrame = null;
      let frameId = null;
      const TAU = Math.PI * 2;
      const f = value => value.toFixed(3);
      const transform = (node, value) => node.setAttribute('transform', value);
      const modulo = (value, range) => ((value % range) + range) % range;

      // Two linked segments solve the knee position so the foot never slips
      // from the pedal. The other pedal is always half a turn behind.
      function poseLeg(leg, foot, hip, phase) {
        const ankle = { x: 492 + 32 * Math.cos(phase), y: 430 + 32 * Math.sin(phase) };
        const dx = ankle.x - hip.x, dy = ankle.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const thigh = 72, shin = 83;
        const along = (thigh * thigh - shin * shin + distance * distance) / (2 * distance);
        const height = Math.sqrt(Math.max(0, thigh * thigh - along * along));
        const knee = {
          x: hip.x + dx * along / distance + dy * height / distance,
          y: hip.y + dy * along / distance - dx * height / distance
        };
        leg.setAttribute('d', 'M' + f(hip.x) + ' ' + f(hip.y) +
          'L' + f(knee.x) + ' ' + f(knee.y) + 'L' + f(ankle.x) + ' ' + f(ankle.y));
        transform(foot, 'translate(' + f(ankle.x) + ' ' + f(ankle.y - 7) + ')');
      }

      function draw() {
        const travel = time * 190;
        const crank = time * 3.2;
        const bob = Math.sin(crank * 2) * 1.7;
        const wheelAngle = modulo(travel / 84 * 180 / Math.PI, 360);
        transform(nodes['spokes-back'], 'rotate(' + f(wheelAngle) + ')');
        transform(nodes['spokes-front'], 'rotate(' + f(wheelAngle) + ')');
        transform(nodes['crank-arms'], 'rotate(' + f(modulo(crank * 180 / Math.PI, 360)) + ')');
        transform(nodes['pelican-body'], 'translate(0 ' + f(bob) + ')');
        transform(nodes['head-neck'], 'rotate(' + f(Math.sin(crank) * .7) + ' 550 230)');
        poseLeg(nodes['leg-back'], nodes['foot-back'], { x: 465, y: 322 + bob }, crank + Math.PI);
        poseLeg(nodes['leg-front'], nodes['foot-front'], { x: 482, y: 326 + bob }, crank);

        // The shoulder follows the body; the far end stays on the handlebar.
        const shoulderY = 245 + bob;
        nodes.wing.setAttribute('d', 'M458 ' + f(shoulderY) + 'C483 ' + f(224 + bob) +
          ' 517 ' + f(241 + bob) + ' 545 262Q584 288 635 285Q652 286 641 296' +
          'C592 313 548 289 516 ' + f(280 + bob) + 'C492 ' + f(285 + bob) +
          ' 469 ' + f(273 + bob) + ' 458 ' + f(shoulderY) + 'Z');
        transform(nodes['wing-detail'], 'translate(0 ' + f(bob * .65) + ')');

        const breeze = Math.sin(time * 4.5) * 4;
        nodes['scarf-tail'].setAttribute('d', 'M542 217C518 ' + f(205 + breeze) +
          ' 492 ' + f(222 - breeze) + ' 470 ' + f(208 + breeze) +
          'L477 ' + f(225 + breeze) + 'C502 ' + f(237 - breeze) + ' 525 219 542 229Z');
        const blinkPhase = modulo(time, 4.7);
        const eyeScale = blinkPhase > 4.42 && blinkPhase < 4.58 ? .12 : 1;
        transform(nodes.eye, 'translate(594 160) scale(1 ' + eyeScale + ')');

        transform(nodes['cloud-a'], 'translate(' + f(modulo(460 - travel * .08, 1270) - 230) + ' 78)');
        transform(nodes['cloud-b'], 'translate(' + f(modulo(170 - travel * .05, 1180) - 120) + ' 209) scale(.65)');
        transform(nodes['cloud-c'], 'translate(' + f(modulo(1040 - travel * .07, 1270) - 150) + ' 205) scale(.8)');
        transform(nodes['sea-ripples'], 'translate(' + f(-modulo(travel * .14, 180)) + ' 0)');
        transform(nodes['road-lines'], 'translate(' + f(-modulo(travel, 160)) + ' 0)');
        transform(nodes.roadside, 'translate(' + f(-modulo(travel * .4, 1120)) + ' 0)');
        transform(nodes['foreground-grass'], 'translate(' + f(-modulo(travel * 1.18, 1060)) + ' 0)');
        nodes['bike-shadow'].setAttribute('rx', f(239 + bob));
      }

      function updateControls() {
        nodes['toggle-text'].textContent = running ? '暂停动画' : '播放动画';
        nodes.toggle.setAttribute('aria-pressed', String(!running));
        nodes['play-icon'].setAttribute('d', running ? 'M4 3h3v10H4zM9 3h3v10H9z' : 'M4 2l10 6-10 6z');
        nodes.scene.dataset.state = running ? 'playing' : 'paused';
      }

      function tick(timestamp) {
        frameId = null;
        if (!running || document.hidden) { lastFrame = null; return; }
        if (lastFrame !== null) time += Math.min((timestamp - lastFrame) / 1000, .05) * speed;
        lastFrame = timestamp;
        draw();
        frameId = requestAnimationFrame(tick);
      }

      function schedule() {
        if (running && !document.hidden && frameId === null) frameId = requestAnimationFrame(tick);
      }

      function setRunning(value) {
        running = value;
        lastFrame = null;
        if (frameId !== null) { cancelAnimationFrame(frameId); frameId = null; }
        updateControls();
        schedule();
      }

      function restart() {
        time = 0;
        draw();
        setRunning(true);
      }

      nodes.toggle.addEventListener('click', () => setRunning(!running));
      nodes.restart.addEventListener('click', restart);
      nodes.speed.addEventListener('input', () => {
        speed = Number(nodes.speed.value);
        nodes['speed-value'].textContent = speed + '×';
        nodes.speed.setAttribute('aria-valuetext', speed + ' 倍骑行节奏');
      });
      document.addEventListener('keydown', event => {
        if (event.target instanceof Element && event.target.closest('input,button,textarea,select,[contenteditable]')) return;
        if (event.code === 'Space') { event.preventDefault(); setRunning(!running); }
        if (event.key.toLowerCase() === 'r') restart();
      });
      document.addEventListener('visibilitychange', () => {
        lastFrame = null;
        if (document.hidden && frameId !== null) { cancelAnimationFrame(frameId); frameId = null; }
        schedule();
      });
      reduceMotion.addEventListener('change', event => {
        if (event.matches) {
          setRunning(false);
          nodes['motion-note'].textContent = '已按系统设置减少动态效果；点击播放可手动开始。';
        } else {
          nodes['motion-note'].textContent = '空格键暂停 / 继续，R 键从头播放。';
        }
      });
      if (reduceMotion.matches) nodes['motion-note'].textContent = '已按系统设置减少动态效果；点击播放可手动开始。';
      nodes.speed.setAttribute('aria-valuetext', '1 倍骑行节奏');
      draw();
      updateControls();
      schedule();
    })();
  </script>
</body>
</html>
