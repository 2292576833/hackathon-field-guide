<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3e9">
  <meta name="description" content="一只鹈鹕悠闲地骑着自行车，沿海岸追逐海风。独立 SVG 2D 动画，支持暂停与调速。">
  <title>鹈鹕的海岸骑行 · SVG 动画</title>
  <style>
    :root { color-scheme: light; --paper: #f6f3e9; --ink: #244941; --muted: #708078; --orange: #dc7653; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .page { width: min(1280px, 100%); margin: auto; padding: 30px 48px 22px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; padding-bottom: 24px; border-bottom: 1px solid #24494120; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; letter-spacing: .16em; }
    .brand svg { width: 29px; height: 29px; }
    .edition { color: var(--muted); font-size: 11px; letter-spacing: .12em; }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 24px; padding: 36px 0 28px; }
    .eyebrow { margin: 0 0 11px; color: var(--orange); font-size: 10px; font-weight: 700; letter-spacing: .22em; }
    h1 { margin: 0; font-family: "STSong", "Noto Serif SC", "Songti SC", serif; font-size: clamp(29px, 4.3vw, 54px); font-weight: 500; letter-spacing: .045em; line-height: 1.3; }
    .intro-note { margin: 0 0 6px; color: var(--muted); font-size: 12px; line-height: 1.9; text-align: right; }
    .stage { position: relative; overflow: hidden; border-radius: 5px; background: #dce8dc; }
    .scene { display: block; width: 100%; height: auto; aspect-ratio: 1200 / 730; }
    .scene-label { position: absolute; top: 23px; left: 26px; display: flex; align-items: center; gap: 8px; color: #3b655b; font-size: 10px; letter-spacing: .17em; pointer-events: none; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #588e72; }
    .stage[data-playing="false"] .status-dot { background: #bd9673; }
    .scene-coordinate { position: absolute; bottom: 22px; right: 25px; color: #658176; font: 10px/1 monospace; letter-spacing: .12em; pointer-events: none; }
    .controls { display: flex; justify-content: space-between; align-items: center; gap: 22px; padding: 22px 0; }
    .playback { display: flex; align-items: center; gap: 10px; }
    .play { min-width: 104px; display: flex; align-items: center; justify-content: center; gap: 9px; padding: 11px 18px; color: var(--paper); background: var(--ink); border: 1px solid var(--ink); border-radius: 40px; font-size: 12px; cursor: pointer; }
    .play:hover { background: #3a6358; }
    .play svg { width: 13px; height: 13px; }
    .reset { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border: 1px solid #24494126; border-radius: 50%; color: var(--ink); background: transparent; cursor: pointer; }
    .reset:hover { background: #e8eadc; }
    .reset svg { width: 16px; height: 16px; }
    .speed-control { display: flex; align-items: center; gap: 15px; font-size: 11px; color: var(--muted); }
    input[type="range"] { width: 130px; height: 20px; cursor: pointer; accent-color: #416d5c; }
    output { min-width: 31px; color: var(--ink); font-variant-numeric: tabular-nums; }
    button:focus-visible, input:focus-visible { outline: 3px solid #df825a; outline-offset: 5px; }
    footer { display: flex; justify-content: space-between; gap: 14px; padding-top: 17px; border-top: 1px solid #24494120; color: #879087; font-size: 10px; letter-spacing: .06em; }
    .wind-caption { display: flex; align-items: center; gap: 8px; }
    .wind-caption svg { width: 17px; height: 17px; }
    .grain { opacity: .1; pointer-events: none; }
    @media (max-width: 650px) {
      .page { padding: 22px 18px 20px; }
      .masthead { padding-bottom: 18px; }
      .brand { font-size: 10px; gap: 7px; letter-spacing: .12em; }
      .edition { font-size: 9px; letter-spacing: .02em; }
      .intro { padding: 25px 0 22px; display: block; }
      .intro-note { margin: 12px 0 0; text-align: left; font-size: 11px; }
      .intro-note br { display: none; }
      .scene-label { left: 13px; top: 13px; font-size: 8px; }
      .scene-coordinate { bottom: 12px; right: 12px; font-size: 8px; }
      .controls { gap: 14px; flex-wrap: wrap; padding: 18px 0; }
      .speed-control { gap: 9px; }
      input[type="range"] { width: 90px; }
      .play { min-width: 84px; padding: 10px 13px; }
      footer { font-size: 9px; line-height: 1.6; }
    }
  </style>
</head>

  <script>
    (() => {
      'use strict';
      const get = (id) => document.getElementById(id);
      const el = Object.fromEntries(['stage', 'sceneStatus', 'play', 'playIcon', 'playLabel', 'reset', 'speed', 'speedValue', 'rearSpokes', 'frontSpokes', 'chainring', 'cranks', 'nearPedal', 'farPedal', 'nearLeg', 'farLeg', 'nearLegHighlight', 'nearFoot', 'farFoot', 'riderBody', 'ridingScene', 'grippingWing', 'wingFeathers', 'scarfLong', 'scarfShort', 'eye', 'clouds', 'distantBirds', 'waterLines', 'dunes', 'road', 'grass', 'lighthouse', 'foreground', 'shadow'].map((id) => [id, get(id)]));
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !reducedMotion.matches;
      let speed = 1;
      let time = 0;
      let lastTimestamp = null;
      let frameId = null;
      const tau = Math.PI * 2;
      const crankRate = 2.7; // Radians per second, shared by both feet and the crank.
      const gearRatio = 1.85;
      const wheelRadius = 93;
      const number = (n) => n.toFixed(3);
      const translate = (id, x, y = 0) => el[id].setAttribute('transform', `translate(${number(x)} ${number(y)})`);
      const rotate = (id, degrees) => el[id].setAttribute('transform', `rotate(${number(degrees)})`);

      // Two-link inverse kinematics keeps each foot on its actual pedal.
      function leg(phase, bob, far) {
        const px = 574 + Math.cos(phase) * 31;
        const py = 502 + Math.sin(phase) * 31;
        const hip = { x: far ? 516 : 522, y: 379 + bob };
        const ankle = { x: px - 4, y: py - 8 };
        const dx = ankle.x - hip.x;
        const dy = ankle.y - hip.y;
        const length = Math.hypot(dx, dy);
        const thigh = 93;
        const shin = 86;
        const along = (thigh * thigh - shin * shin + length * length) / (2 * length);
        const height = Math.sqrt(Math.max(0, thigh * thigh - along * along));
        const knee = { x: hip.x + dx * along / length + dy * height / length, y: hip.y + dy * along / length - dx * height / length };
        const path = `M${number(hip.x)} ${number(hip.y)}L${number(knee.x)} ${number(knee.y)}L${number(ankle.x)} ${number(ankle.y)}`;
        const prefix = far ? 'far' : 'near';
        el[prefix + 'Leg'].setAttribute('d', path);
        if (!far) el.nearLegHighlight.setAttribute('d', path);
        translate(prefix + 'Foot', px, py - 10);
        el[prefix + 'Pedal'].setAttribute('d', `M${number(px - 14)} ${number(py + 1)}h30`);
        return { x: px, y: py };
      }

      function render() {
        const phase = time * crankRate + .2;
        const wheelAngle = time * crankRate * gearRatio;
        const travel = wheelAngle * wheelRadius;
        const bob = Math.sin(phase * 2) * 2.2;
        const bikeBob = Math.sin(travel / 92) * .65;
        rotate('rearSpokes', wheelAngle * 180 / Math.PI);
        rotate('frontSpokes', wheelAngle * 180 / Math.PI);
        el.chainring.setAttribute('transform', `translate(574 502) rotate(${number(phase * 180 / Math.PI)})`);
        const near = leg(phase, bob, false);
        const far = leg(phase + Math.PI, bob, true);
        el.cranks.setAttribute('d', `M${number(near.x)} ${number(near.y)}L574 502L${number(far.x)} ${number(far.y)}`);
        translate('riderBody', 0, bob);
        translate('ridingScene', 0, bikeBob);
        const shoulder = 310 + bob;
        el.grippingWing.setAttribute('d', `M486 ${shoulder}C532 ${shoulder - 26} 567 ${shoulder + 7} 602 330Q648 344 689 348Q699 348 700 356Q700 364 687 365Q630 367 586 351C546 ${shoulder + 43} 511 ${shoulder + 51} 485 ${shoulder + 27}Q474 ${shoulder + 16} 486 ${shoulder}Z`);
        el.wingFeathers.setAttribute('d', `M494 ${shoulder + 14}Q536 ${shoulder + 43} 576 341M501 ${shoulder + 25}Q535 ${shoulder + 48} 561 349M605 344q31 10 66 11`);
        const flutter = Math.sin(time * 6) * 5;
        el.scarfLong.setAttribute('d', `M562 ${271 + bob}Q522 ${252 + flutter} 465 ${265 - flutter}L478 ${280 - flutter}Q522 ${266 + flutter} 565 ${285 + bob}Z`);
        el.scarfShort.setAttribute('d', `M565 ${276 + bob}Q537 ${284 - flutter} 503 ${299 + flutter}L516 ${308 + flutter}Q543 ${291 - flutter} 575 ${287 + bob}Z`);
        const blinkTime = time % 6.8;
        const blink = blinkTime > 6.54 ? Math.max(.07, Math.abs((blinkTime - 6.67) / .13)) : 1;
        el.eye.setAttribute('transform', `translate(600 211) scale(1 ${number(blink)})`);
        translate('road', -(travel % 340));
        translate('grass', -(travel % 300), 591);
        translate('dunes', -((travel * .25) % 600), 502);
        translate('waterLines', -((travel * .09) % 1200));
        translate('clouds', -((time * 5) % 1314));
        translate('distantBirds', -Math.sin(time * .13) * 18, Math.sin(time * .65) * 3);
        translate('lighthouse', 1320 - ((travel * .16 + 280) % 1620), 337);
        translate('foreground', -((travel * 1.2) % 1320), 722);
        el.shadow.setAttribute('rx', number(245 - bob * 1.5));
      }

      function updateControls() {
        el.stage.dataset.playing = String(playing);
        el.playLabel.textContent = playing ? '暂停' : '播放';
        el.sceneStatus.textContent = playing ? '海岸骑行中' : '停下来，看看海';
        el.play.setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        el.playIcon.innerHTML = playing ? '<path d="M3 2h3v12H3zM10 2h3v12h-3z"/>' : '<path d="M4 1.5 14 8 4 14.5Z"/>';
      }

      function frame(timestamp) {
        if (lastTimestamp !== null) time += Math.min((timestamp - lastTimestamp) / 1000, .06) * speed;
        lastTimestamp = timestamp;
        render();
        frameId = requestAnimationFrame(frame);
      }

      function schedule() {
        if (frameId !== null) cancelAnimationFrame(frameId);
        frameId = null;
        lastTimestamp = null;
        if (playing && !document.hidden) frameId = requestAnimationFrame(frame);
        updateControls();
      }

      el.play.addEventListener('click', () => { playing = !playing; schedule(); });
      el.reset.addEventListener('click', () => { time = 0; render(); schedule(); });
      el.speed.addEventListener('input', () => {
        speed = Number(el.speed.value);
        el.speedValue.value = speed.toFixed(1) + '×';
        el.speed.setAttribute('aria-valuetext', `${speed.toFixed(1)} 倍速度`);
      });
      document.addEventListener('visibilitychange', schedule);
      reducedMotion.addEventListener('change', (event) => { if (event.matches) { playing = false; schedule(); } });
      render();
      schedule();
    })();
  </script>
</body>
</html>
