<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e8">
  <title>海风骑行记 · 鹈鹕 SVG 动画</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23c8ded4'/%3E%3Cpath d='M15 41Q7 22 24 18Q41 14 37 34L58 30L36 43Z' fill='%23fffaf0'/%3E%3Cpath d='M35 31L59 32L37 41Z' fill='%23e99b55'/%3E%3Ccircle cx='30' cy='25' r='3' fill='%232c4851'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light; --ink: #2e4850; --muted: #72847f; --paper: #fffcf5; --accent: #cf7050; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 34px 24px; color: var(--ink); background: #f3efe6; font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
    .postcard { width: min(1100px, 100%); }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 0 4px 24px; }
    .eyebrow { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; color: #79908a; font-size: 11px; letter-spacing: .18em; font-weight: 700; }
    .eyebrow::before { content: ""; width: 18px; height: 2px; background: var(--accent); }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 42px); font-weight: 750; letter-spacing: -.04em; }
    .intro { margin: 11px 0 0; color: var(--muted); font-size: 14px; line-height: 1.65; }
    .stamp { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid #cfd8cc; border-radius: 100px; font-size: 12px; white-space: nowrap; }
    .stamp::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #d79a56; }
    .frame { overflow: hidden; border: 8px solid var(--paper); border-radius: 24px; background: #fffcf5; box-shadow: 0 18px 48px #38524913, 0 2px 4px #38524908; }
    .scene { display: block; width: 100%; height: auto; background: #b8dbd9; }
    .scene path, .scene line { stroke-linecap: round; stroke-linejoin: round; }
    .control-bar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px 21px; background: var(--paper); }
    .actions { display: flex; align-items: center; gap: 8px; }
    button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 10px 16px; border: 1px solid #dae0d5; border-radius: 11px; font: inherit; font-size: 13px; color: var(--ink); background: transparent; cursor: pointer; transition: background .2s, border-color .2s; }
    button:hover { background: #ecefe4; border-color: #c2d1c4; }
    button.primary { border-color: #2e5657; color: #fffcf5; background: #2e5657; }
    button.primary:hover { background: #3b6866; }
    button:focus-visible, input:focus-visible { outline: 3px solid #eaa97b; outline-offset: 4px; }
    button svg { width: 16px; height: 16px; flex: none; }
    .speed { display: flex; align-items: center; gap: 12px; color: #72847f; font-size: 12px; }
    input[type="range"] { width: 120px; height: 22px; margin: 0; accent-color: #cf7050; cursor: pointer; }
    output { min-width: 32px; color: var(--ink); font-variant-numeric: tabular-nums; }
    footer { display: flex; justify-content: space-between; gap: 12px; padding: 17px 5px 0; font-size: 11px; color: #8b9790; letter-spacing: .03em; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    @media (max-width: 600px) {
      body { padding: 25px 13px; }
      header { align-items: start; margin-bottom: 19px; }
      .stamp { display: none; }
      .frame { border-width: 5px; border-radius: 18px; }
      .control-bar { flex-wrap: wrap; padding: 14px 12px; gap: 15px; }
      .actions { flex: 1 1 100%; }
      .actions button { flex: 1; }
      .speed { width: 100%; }
      .speed input { flex: 1; min-width: 0; }
      footer { flex-wrap: wrap; font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <main class="postcard">
    <header>
      <div>
        <p class="eyebrow">A LITTLE SEASIDE ADVENTURE</p>
        <h1>海风骑行记</h1>
        <p class="intro">跟着鹈鹕，慢慢骑过一整个晴天。</p>

    <div class="frame">

        <desc id="scene-description">鹈鹕有长长的橙色嘴巴和喉囊，翅膀扶着车把，双脚轮流踩踏，车轮绕各自的轮心旋转。海浪、云朵和路边植物缓缓掠过。</desc>
        <defs>

          <symbol id="cloud" viewBox="0 0 190 65"><path d="M16 61C-3 58-1 31 22 28C18 5 53-5 68 16C87-8 126 0 130 26C156 10 186 28 185 45C185 59 174 63 158 63Z" fill="#f6f7e7"/></symbol>

        <!-- The far leg goes behind the frame; both feet follow the crank. -->
        <path id="leg-back" d="M462 358L537 407L507 485" fill="none" stroke="#b8774d" stroke-width="11"/>
        <g id="foot-back" transform="translate(507 485)"><path d="M-9-6L13-5L23 5Q12 12-3 6L-13 2Z" fill="#d58a50" stroke="#946346" stroke-width="2.5"/></g>

        <g fill="none" stroke-linejoin="round">
          <path d="M380 490L460 394L530 485ZM460 394L616 380L530 485M616 380L660 490" stroke="#a7674f" stroke-width="12"/>
          <path d="M380 490L460 394L530 485ZM460 394L616 380L530 485M616 380L660 490" stroke="#e28c61" stroke-width="7"/>
          <path d="M460 394L454 371" stroke="#4b676b" stroke-width="7"/>
          <path d="M616 380L600 319Q596 300 621 300L646 305" stroke="#46626a" stroke-width="7"/>
          <path d="M627 302L650 307" stroke="#745d49" stroke-width="10"/>
          <path d="M530 485L383 492M530 504L383 497" stroke="#667b75" stroke-width="2"/>
        </g>
        <path d="M429 373Q458 360 485 374Q490 382 476 384H435Q422 383 429 373Z" fill="#5b6255" stroke="#344e53" stroke-width="3"/>
        <circle cx="530" cy="485" r="27" fill="#b6c9b8" stroke="#48616a" stroke-width="3.5"/>
        <circle cx="530" cy="485" r="20" fill="none" stroke="#e6e4cd" stroke-width="3"/>
        <path id="crank" d="M507 485H553" stroke="#4e696f" stroke-width="5"/>
        <circle cx="530" cy="485" r="7" fill="#e1a270" stroke="#344e53" stroke-width="3"/>

        <path id="leg-front" d="M462 358L555 403L553 485" fill="none" stroke="#e5a269" stroke-width="12"/>
        <g id="foot-front" transform="translate(553 485)">
          <path d="M-11 0H26" stroke="#3e5860" stroke-width="5"/>
          <path d="M-10-6L10-7L24 3Q16 11 8 6L2 10L-6 5L-14 4Z" fill="#f0b56f" stroke="#a26c46" stroke-width="2.5"/>
          <path d="M-1-2L7 4M7-3L15 3" stroke="#cc8e52" stroke-width="1.5"/>
        </g>

        <!-- White feathers and a generous throat pouch make this unmistakably a pelican. -->
        <g id="rider" stroke="#36515a" stroke-width="3.5">
          <path d="M382 339L326 342Q339 357 376 364L404 354Z" fill="#6d8687"/>
          <path d="M388 324L339 321Q348 345 383 352L411 339Z" fill="#f4f1df"/>
          <path d="M436 299C441 264 471 250 480 213L521 201C531 231 507 248 493 279L498 318Z" fill="url(#feathers)"/>
          <path d="M376 330C359 309 363 278 388 260C423 234 472 251 493 290C512 319 500 353 481 371C454 394 404 387 382 365C370 353 371 340 376 330Z" fill="url(#feathers)"/>
          <path d="M392 343Q408 370 445 370" fill="none" stroke="#c7d5cc" stroke-width="3"/>
          <path d="M379 341Q385 352 394 354M389 345Q396 356 407 358" fill="none" stroke="#c1cec4" stroke-width="2.5"/>
          <g id="scarf" stroke="#a45f4d" stroke-width="2.5">
            <path id="scarf-tail" d="M476 244Q448 249 424 234L406 251Q443 273 476 253Z" fill="#d78568"/>
            <path d="M474 230Q490 241 509 229L506 243Q488 252 474 243Z" fill="#e8a27d"/>
            <path d="M476 240L464 241L469 253L480 249Z" fill="#c8795d"/>
          </g>
          <g id="head">
            <path d="M480 194C472 172 485 150 506 145C534 139 558 152 562 173C566 196 552 216 532 218C505 222 486 212 480 194Z" fill="#fffbed"/>
            <path d="M483 168Q474 153 482 146M489 157Q483 145 490 140M497 151Q492 141 499 138" fill="none" stroke="#fffbed" stroke-width="7"/>

            <path d="M570 217Q616 247 664 245" fill="none" stroke="#f5d094" stroke-width="4"/>
            <path d="M553 194C600 187 691 190 749 203Q759 207 750 211L554 214Z" fill="#eea65c"/>
            <path d="M575 202Q657 198 725 205" fill="none" stroke="#f9cb7f" stroke-width="3"/>
            <path d="M555 212L748 211" fill="none" stroke="#ad754e" stroke-width="2.5"/>

            <path d="M531 168Q538 162 546 167" fill="none" stroke-width="2.5"/>

            <path d="M416 288C435 267 465 270 487 283L535 297L631 301Q649 299 651 310Q650 320 632 318L532 313C511 335 482 347 453 336C429 329 416 313 416 288Z" fill="#d4ded7"/>
            <path d="M445 298Q466 324 507 315M437 308Q459 332 482 329" fill="none" stroke="#b3c7bd" stroke-width="3"/>
            <path d="M627 301L641 301Q653 302 651 311Q648 320 631 317Z" fill="#819c9a"/>
            <path d="M633 306L646 310M632 312L644 315" stroke="#55797b" stroke-width="2"/>
          </g>

        <!-- Small finishing details. -->
        <path d="M616 319H625" stroke="#4f6d70" stroke-width="3"/>
        <path d="M612 319Q612 308 621 308Q630 308 630 319Z" fill="#f0cc7a" stroke="#8d926a" stroke-width="2"/>
        <path d="M320 283H345M301 300H331M318 318H340" fill="none" stroke="#f2f4db" stroke-width="3" opacity=".8"/>
        <g id="plants-front">
          <use href="#plant" transform="translate(72 610) scale(1.15)"/><use href="#plant" transform="translate(955 611) scale(.95)"/>
          <use href="#plant" transform="translate(1172 610) scale(1.15)"/><use href="#plant" transform="translate(2055 611) scale(.95)"/>
          <g fill="#f1ddaa"><circle cx="177" cy="603" r="3"/><circle cx="822" cy="609" r="3"/><circle cx="1277" cy="603" r="3"/><circle cx="1922" cy="609" r="3"/></g>
        </g>
      </svg>

      <div class="control-bar" role="group" aria-label="动画控制">
        <div class="actions">
          <button id="toggle" class="primary" type="button" aria-pressed="false">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path id="toggle-icon" d="M4 3V13M12 3V13" fill="none" stroke="currentColor" stroke-width="3"/></svg>
            <span id="toggle-label">暂停动画</span>
          </button>
          <button id="restart" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6A5.5 5.5 0 1 1 3 10M3 2V6H7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>重新开始</button>
        </div>
        <label class="speed" for="speed">骑行速度<input id="speed" type="range" min="0.5" max="2" step="0.1" value="1"><output id="speed-value" for="speed">1.0×</output></label>
        <span id="motion-status" class="sr-only" role="status"></span>
      </div>
    </div>
    <footer><span>纯 SVG 绘制 · 一张会动的海边明信片</span><span>空格键暂停 / 继续</span></footer>
  </main>

  <script>
    (() => {
      'use strict';
      const byId = (id) => document.getElementById(id);
      const nodes = Object.fromEntries(['wheel-back', 'wheel-front', 'rider', 'wing', 'head', 'eye', 'scarf-tail', 'leg-front', 'leg-back', 'foot-front', 'foot-back', 'crank', 'clouds', 'gulls', 'wave-texture', 'road-dashes', 'plants-back', 'plants-front'].map((id) => [id, byId(id)]));
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const toggle = byId('toggle');
      const slider = byId('speed');
      const tau = Math.PI * 2;
      let elapsed = 0;
      let speed = 1;
      let playing = !motionPreference.matches;
      let previous = null;
      let frame = 0;
      const format = (number) => number.toFixed(2);
      const point = (x, y) => `${format(x)} ${format(y)}`;

      // Solve two fixed-length leg segments. The foot stays exactly on its pedal.
      function drawLeg(side, angle, bob) {
        const hip = { x: 462, y: 358 + bob };
        const foot = { x: 530 + 23 * Math.cos(angle), y: 485 + 23 * Math.sin(angle) };
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const upper = 91;
        const lower = 88;
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
        const knee = { x: hip.x + dx * along / distance + dy * bend / distance, y: hip.y + dy * along / distance - dx * bend / distance };
        nodes[`leg-${side}`].setAttribute('d', `M${point(hip.x, hip.y)}L${point(knee.x, knee.y)}L${point(foot.x, foot.y)}`);
        nodes[`foot-${side}`].setAttribute('transform', `translate(${point(foot.x, foot.y)}) rotate(${format(5 * Math.sin(angle))})`);
        return foot;
      }

      function draw(time) {
        const phase = time * tau / 2.2;
        const wheelAngle = phase * 1.55;
        const distance = wheelAngle * 75;
        const bob = Math.sin(phase * 2) * 2.3;
        const degrees = format(wheelAngle * 180 / Math.PI % 360);
        nodes['wheel-back'].setAttribute('transform', `rotate(${degrees})`);
        nodes['wheel-front'].setAttribute('transform', `rotate(${degrees})`);
        nodes.rider.setAttribute('transform', `translate(0 ${format(bob)})`);
        nodes.wing.setAttribute('transform', `rotate(${format(Math.sin(phase) * .35)} 638 307)`);
        nodes.head.setAttribute('transform', `rotate(${format(Math.sin(phase) * .6)} 497 217)`);
        nodes['scarf-tail'].setAttribute('d', `M476 244Q448 ${format(249 + 4 * Math.sin(phase * 2))}424 ${format(234 + 5 * Math.sin(phase * 2 - .7))}L406 ${format(251 + 5 * Math.sin(phase * 2 - 1))}Q443 ${format(273 + 4 * Math.sin(phase * 2))}476 253Z`);
        const blinkTime = time % 5.4;
        const blinkScale = blinkTime > 4.85 && blinkTime < 5.03 ? .12 : 1;
        nodes.eye.setAttribute('transform', `translate(540 180) scale(1 ${blinkScale}) translate(-540 -180)`);
        const front = drawLeg('front', phase, bob);
        const back = drawLeg('back', phase + Math.PI, bob);
        nodes.crank.setAttribute('d', `M${point(back.x, back.y)}L${point(front.x, front.y)}`);
        nodes.clouds.setAttribute('transform', `translate(${format(-(distance * .025 % 1025))} 0)`);
        nodes.gulls.setAttribute('transform', `translate(0 ${format(Math.sin(time * .8) * 3)})`);
        nodes['wave-texture'].setAttribute('transform', `translate(${format(-(distance * .12 % 160))} 0)`);
        nodes['road-dashes'].setAttribute('stroke-dashoffset', format(distance % 160));
        nodes['plants-back'].setAttribute('transform', `translate(${format(-(distance * .68 % 1100))} 0)`);
        nodes['plants-front'].setAttribute('transform', `translate(${format(-(distance % 1100))} 0)`);
      }

      function tick(now) {
        frame = 0;
        if (!playing || document.hidden) { previous = null; return; }
        if (previous !== null) elapsed += Math.min((now - previous) / 1000, .05) * speed;
        previous = now;
        draw(elapsed);
        frame = requestAnimationFrame(tick);
      }

      function syncPlayback() {
        if (frame) cancelAnimationFrame(frame);
        frame = 0;
        previous = null;
        toggle.setAttribute('aria-pressed', String(!playing));
        byId('toggle-label').textContent = playing ? '暂停动画' : '播放动画';
        byId('toggle-icon').setAttribute('d', playing ? 'M4 3V13M12 3V13' : 'M5 3L12 8L5 13Z');
        byId('toggle-icon').setAttribute('stroke-width', playing ? '3' : '1.7');
        byId('motion-status').textContent = playing ? '动画正在播放' : '动画已暂停';
        if (playing && !document.hidden) frame = requestAnimationFrame(tick);
      }

      toggle.addEventListener('click', () => { playing = !playing; syncPlayback(); });
      byId('restart').addEventListener('click', () => { elapsed = 0; draw(0); playing = !motionPreference.matches; syncPlayback(); });
      slider.addEventListener('input', () => { speed = Number(slider.value); byId('speed-value').textContent = `${speed.toFixed(1)}×`; });
      document.addEventListener('keydown', (event) => {
        if (event.code !== 'Space' || event.repeat || event.target.closest('input, button, textarea, select, [contenteditable]')) return;
        event.preventDefault();
        playing = !playing;
        syncPlayback();
      });
      document.addEventListener('visibilitychange', syncPlayback);
      motionPreference.addEventListener('change', (event) => { if (event.matches) { playing = false; syncPlayback(); } });
      window.addEventListener('pagehide', () => { if (frame) cancelAnimationFrame(frame); });
      window.addEventListener('pageshow', syncPlayback);
      draw(0);
      syncPlayback();
    })();
  </script>
</body>
</html>
